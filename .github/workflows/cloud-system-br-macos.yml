name: Cloud System BR - macOS

# No push/pull_request/scheduled trigger: publishing this file does not start a runner.
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Arquitetura do Mac'
        type: choice
        required: true
        default: arm64
        options:
          - arm64
          - intel
          - both

permissions:
  contents: read

concurrency:
  group: cloud-system-br-macos
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Obter fontes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Conferir identidade e arquivos de compilacao
        run: python3 packaging/verify_ci_inputs.py
      - name: Selecionar arquiteturas
        id: matrix
        env:
          REQUESTED_ARCH: ${{ inputs.architecture }}
        run: |
          python3 - <<'PY'
          import json, os
          choices = {
              "arm64": {"architecture": "arm64", "runner": "macos-15"},
              "intel": {"architecture": "intel", "runner": "macos-15-intel"},
          }
          requested = os.environ["REQUESTED_ARCH"]
          selected = list(choices.values()) if requested == "both" else [choices[requested]]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": selected}) + "\n")
          PY

  build:
    needs: prepare
    permissions:
      contents: write
    name: macOS - ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SIGN_PACKAGE: 'False'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Obter fontes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compilar e gerar candidato DMG
        shell: pwsh
        run: ./packaging/compilar-no-mac.ps1 -Architecture '${{ matrix.architecture }}'
      - name: Conferir aplicativo e DMG
        shell: bash
        run: python3 packaging/verify_built_macos.py 'binaries/${{ matrix.architecture }}'
      - name: Disponibilizar instalador em release de teste
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCH: ${{ matrix.architecture }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh release create "macos-${ARCH}-${RUN_ID}" binaries/${ARCH}/*.dmg binaries/${ARCH}/*.sha256 binaries/${ARCH}/*.json "binaries/${ARCH}/LEIA-ME-DISTRIBUICAO.md" --prerelease --title "Cloud System BR macOS ${ARCH}" --notes "Versao de teste. Assinatura ad-hoc, sem notarizacao Apple. Login e sincronizacao requerem validacao em Mac real."
